controls:
  - id: CSPM-IAM-001
    title: No standing human administrator access
    domain: identity
    severity: high
    rationale: Persistent administrator access increases blast radius and bypasses just-in-time privilege controls.

  - id: CSPM-DATA-001
    title: Sensitive object storage must not be public
    domain: data
    severity: critical
    rationale: Public exposure of sensitive data can create immediate confidentiality and regulatory impact.

  - id: CSPM-LOG-001
    title: Control-plane audit logging must be complete
    domain: detection
    severity: medium
    rationale: Missing administrative telemetry weakens investigation and evidence quality.
